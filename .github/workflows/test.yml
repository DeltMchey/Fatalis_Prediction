# P3.1: CI 测试工作流
# 每次 push 或 PR 到 master/main 时运行 pytest + coverage

name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 项目为 Windows-only（pymem/Win32/PyInstaller EXE），只测目标平台。
        # 依赖钉版基线为 Python 3.12.6（见 requirements.txt / requirements-experiment.txt），
        # CI 与开发环境保持同源，单版本矩阵
        os: [windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 与本地开发环境完全同源：requirements.txt（运行时，含 v1.2.0 生产模型
      # 所需的 xgboost/scipy）+ requirements-experiment.txt（实验工具链 flaml/psutil，
      # test_train_automl / test_benchmark_model 需要其可导入）
      - name: Install dependencies (runtime + experiment tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-experiment.txt
          pip install pytest pytest-cov

      - name: Check import — core packages
        run: |
          python -c "import numpy, pandas, sklearn, lightgbm, xgboost, matplotlib, joblib; print('Core imports OK')"

      - name: Run pytest with coverage
        run: |
          pytest --cov --cov-report=term --cov-report=xml --cov-report=html -v

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
